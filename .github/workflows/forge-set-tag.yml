name: Forge Set Tag

on:
  workflow_call:
    inputs:
      project:
        description: Vault project name (e.g. admin-stage)
        required: true
        type: string
      config_output_path:
        description: Where to write rendered config
        required: false
        type: string
        default: /var/forge/project.yml
      forge_download_url:
        description: Direct URL to forge binary
        required: false
        type: string
        default: https://github.com/PavelMilanov/forge/releases/latest/download/forge
    outputs:
      tag:
        description: Short git sha tag
        value: ${{ jobs.set-variables.outputs.tag }}
      config_path:
        description: Rendered config file path
        value: ${{ jobs.set-variables.outputs.config_path }}
    secrets:
      VAULT_URL:
        required: true
      VAULT_ROLE_ID:
        required: true
      VAULT_SECRET_ID:
        required: true

jobs:
  set-variables:
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.set_variables.outputs.tag }}
      config_path: ${{ steps.set_variables.outputs.config_path }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Install forge
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/forge "${{ inputs.forge_download_url }}"
          sudo chmod +x /usr/local/bin/forge
          forge version

      - name: Prepare forge config
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /var/forge
          sudo tee /var/forge/forge.yml >/dev/null <<EOF
          vault:
            url: "${{ secrets.VAULT_URL }}"
            role_id: "${{ secrets.VAULT_ROLE_ID }}"
            secret_id: "${{ secrets.VAULT_SECRET_ID }}"
          agent:
            type: ssh
          EOF

      - name: Set variables
        id: set_variables
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          CONFIG_PATH="${{ inputs.config_output_path }}"
          if [[ "$CONFIG_PATH" == "/var/forge/project.yml" ]]; then
            CONFIG_PATH="/var/forge/${{ inputs.project }}.yml"
          fi
          forge env set "${{ inputs.project }}" -p "tag=${SHORT_SHA}"
          forge env get "${{ inputs.project }}" -c > "${CONFIG_PATH}"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "config_path=${CONFIG_PATH}" >> "$GITHUB_OUTPUT"
